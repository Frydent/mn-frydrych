*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Cormorant Garamond',Georgia,serif;
  background:radial-gradient(120% 120% at 50% 0%, #b1697c 0%, #a55467 55%, #a25264 100%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:20px 24px 48px;color:rgb(247,238,235);-webkit-font-smoothing:antialiased}
.col{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center}
/* Sprachumschalter: an der Textspalte ausgerichtet, 44px Touch-Ziel */
.lang{width:100%;display:flex;justify-content:flex-end;gap:2px;margin-bottom:8px}
.lang button{min-width:44px;min-height:44px;background:none;border:0;cursor:pointer;
  font-family:inherit;font-size:13px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(247,238,235,.72);padding:0;transition:color .2s ease}
.lang button[aria-current="true"]{color:rgb(247,238,235);font-weight:600}
.lang button[aria-current="true"]::after{content:"";display:block;width:14px;height:1px;
  margin:3px auto 0;background:currentColor}
.mono{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:rgba(247,238,235,.85) 0 0 0 1.5px inset;margin-top:14px;
  transition:box-shadow .25s ease, background-color .25s ease}
.mono img{transition:opacity .25s ease}
.mono img{width:62px;height:49px;object-fit:contain;transform:translateX(-3px)}
h1{margin:26px 0 0;font-weight:600;font-size:clamp(17px,5vw,23px);letter-spacing:.28em;
  margin-right:-.28em;text-transform:uppercase;text-align:center;line-height:1.35;text-wrap:balance}
.orn{margin-top:16px;display:flex;align-items:center;gap:10px}
.orn i{width:56px;height:1px;background:rgba(247,238,235,.55);display:block}
.orn b{width:5px;height:5px;border-radius:50%;background:rgba(247,238,235,.75);display:block}
.acts{margin-top:30px;width:100%;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px}
.row a{flex:1}
a.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:14px 16px;
  border:1px solid rgba(247,238,235,.6);border-radius:2px;color:rgb(247,238,235);text-decoration:none;
  font-size:15px;letter-spacing:.16em;margin-right:-.16em;text-transform:uppercase;
  transition:background-color .2s ease, border-color .2s ease}
a.cta{transition:filter .2s ease, box-shadow .2s ease;background:rgb(247,238,235);color:#7a3346;border-color:rgb(247,238,235);font-weight:600;letter-spacing:.2em;margin-right:-.2em}
.wh{margin-top:34px;width:100%;display:flex;align-items:center;gap:12px;
  font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(247,238,235,.75)}
.wh i{flex:1;height:1px;background:rgba(247,238,235,.4);display:block}
.worlds{margin-top:14px;width:100%;display:flex;flex-direction:column;gap:10px}
a.world{display:flex;align-items:center;justify-content:space-between;min-height:52px;
  padding:14px 18px;border:1px solid rgba(247,238,235,.6);border-radius:2px;
  color:rgb(247,238,235);text-decoration:none;font-size:15px;letter-spacing:.16em;text-transform:uppercase;
  transition:background-color .2s ease, border-color .2s ease}
a.world span{font-size:12px;letter-spacing:.04em;text-transform:none;color:rgba(247,238,235,.8)}
footer{margin-top:34px;font-size:13px;letter-spacing:.08em;color:rgba(247,238,235,.8);text-align:center;line-height:1.7}
a:focus-visible,button:focus-visible{outline:2px solid rgb(247,238,235);outline-offset:3px}
@media (hover:hover){
  .mono:hover{background:rgba(247,238,235,.08);
    box-shadow:rgba(247,238,235,1) 0 0 0 1.5px inset, rgba(247,238,235,.16) 0 0 0 6px}
  .mono:hover img{opacity:.85}
  a.btn:hover,a.world:hover{background:rgba(247,238,235,.1);border-color:rgba(247,238,235,.95)}
  a.cta:hover{filter:brightness(.94);box-shadow:0 0 0 4px rgba(247,238,235,.16)}
  .lang button:hover{color:rgb(247,238,235)}
}
/* Touch: Hover gibt es dort nicht, also Rueckmeldung beim Tippen */
.mono:active{background:rgba(247,238,235,.12);box-shadow:rgba(247,238,235,1) 0 0 0 1.5px inset}
a.btn:active,a.world:active{background:rgba(247,238,235,.18)}
a.cta:active{filter:brightness(.9)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="col">
  <nav class="lang" aria-label="Sprache / Język / Language">
    <button type="button" data-l="pl">PL</button>
    <button type="button" data-l="en">EN</button>

function fold(t){
  return t.split("\n").map(function(line){
    if(line.length<=75) return line;
    var out=line.slice(0,75), rest=line.slice(75);
    while(rest.length){ out+="\n "+rest.slice(0,74); rest=rest.slice(74); }
    return out;
  }).join("\n");
}
function vcf(l){
  var pre=D[l].vpre||"", lines=[
   "BEGIN:VCARD","VERSION:3.0",
   "N:"+P.last+";"+P.first+";;"+pre+";",
   "FN:"+(pre?pre+" ":"")+P.first+" "+P.last,
   "TITLE:"+D[l].title,
   "ORG:"+P.org,
   "TEL;TYPE=CELL:"+P.telraw,
   "TEL;TYPE=WORK,VOICE:"+P.work,
   "EMAIL;TYPE=INTERNET:"+P.mail,
   "ADR;TYPE=WORK:"+P.adr,
   "URL:https://mn-frydrych.de"+P.path,
   "URL:https://frydent.de",
   "PHOTO;ENCODING=b;TYPE=JPEG:"+P.photo,
   "END:VCARD"];
  return "data:text/vcard;charset=utf-8,"+encodeURIComponent(fold(lines.join("\n"))+"\n");
}
function setLang(l,remember){
  var d=D[l];
  document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=d[e.dataset.t]});
  document.getElementById("vcf").href=vcf(l);
  document.querySelectorAll(".lang button").forEach(function(b){
    b.setAttribute("aria-current", b.dataset.l===l ? "true":"false")});
  if(remember){try{localStorage.setItem("lang",l)}catch(e){}
    history.replaceState(null,"","#"+l)}
}
function pick(){
  var h=(location.hash||"").replace("#","").toLowerCase();
  if(D[h])return h;
  try{var s=localStorage.getItem("lang"); if(D[s])return s}catch(e){}
  var n=(navigator.languages||[navigator.language||"en"]);
  for(var i=0;i<n.length;i++){var c=n[i].slice(0,2).toLowerCase(); if(D[c])return c}
  return "en";
}
document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click",function(){setLang(b.dataset.l,true)})});
setLang(pick(),false);
